name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # GitHub's macOS runners are Apple Silicon and have Metal, so the GPU
    # tests run; the ones that need the sample raw (not in the repo) skip
    # themselves. The LibRaw XCFramework is built from a pinned tag by
    # scripts/build_libraw.sh and cached by that tag.
    runs-on: macos-15
    env:
      LIBRAW_TAG: "0.22.2"
    steps:
      - uses: actions/checkout@v4

      - name: Install autotools
        run: brew install autoconf automake libtool pkg-config

      - name: Cache LibRaw XCFramework
        id: libraw-cache
        uses: actions/cache@v4
        with:
          path: vendor/LibRaw.xcframework
          key: libraw-${{ env.LIBRAW_TAG }}-arm64-v1

      - name: Build LibRaw
        if: steps.libraw-cache.outputs.cache-hit != 'true'
        # The tail of the output is raised as an annotation, which the
        # public API exposes; full logs need a signed-in viewer.
        run: |
          set -o pipefail
          if ! scripts/build_libraw.sh 2>&1 | tee libraw-build.log; then
            echo "::error title=LibRaw build failed::$(tail -c 1500 libraw-build.log | tr '\n' ' ' | tr -d '\r')"
            exit 1
          fi

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test 2>&1 | tail -40
