name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # GitHub's macOS runners are Apple Silicon and have Metal, so the GPU
    # tests run. The golden-image tests render a public-domain raw that
    # scripts/fetch_test_assets.sh downloads and checks; tests that need
    # the author's own sample files (not in the repo) skip themselves. The LibRaw XCFramework is built from a pinned tag by
    # scripts/build_libraw.sh and cached by that tag.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      LIBRAW_TAG: "0.22.2"
      LIBRAW_COMMIT: "b93f6e45c194f5df9b02a43b1af9a54b4f41f33f"
    steps:
      - uses: actions/checkout@v4

      - name: Install autotools
        run: brew install autoconf automake libtool pkg-config

      - name: Cache LibRaw XCFramework
        id: libraw-cache
        uses: actions/cache@v4
        with:
          path: vendor/LibRaw.xcframework
          key: libraw-${{ env.LIBRAW_COMMIT }}-arm64-v1

      - name: Build LibRaw
        if: steps.libraw-cache.outputs.cache-hit != 'true'
        # The tail of the output is raised as an annotation, which the
        # public API exposes; full logs need a signed-in viewer.
        run: |
          set -o pipefail
          if ! scripts/build_libraw.sh 2>&1 | tee libraw-build.log; then
            echo "::error title=LibRaw build failed::$(tail -c 1500 libraw-build.log | tr '\n' ' ' | tr -d '\r')"
            exit 1
          fi

      # Restore and save separately: the plain cache action saves only when
      # the whole job passes, so a failing run would download again.
      - name: Restore golden-image raw
        id: golden-cache
        uses: actions/cache/restore@v4
        with:
          path: TestAssets/golden_nikon_d750_cc0.nef
          key: golden-raw-f90deb28

      - name: Fetch golden-image raw
        run: scripts/fetch_test_assets.sh

      - name: Save golden-image raw
        if: steps.golden-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: TestAssets/golden_nikon_d750_cc0.nef
          key: golden-raw-f90deb28

      - name: Swift version
        run: swift --version

      - name: Build
        run: |
          set -o pipefail
          if ! swift build 2>&1 | tee build.log; then
            echo "::error title=swift build failed::$(grep -E 'error:|error\b' build.log | head -20 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi

      - name: Test
        run: |
          set -o pipefail
          if ! swift test 2>&1 | tee test.log; then
            echo "::error title=swift test failed::$(grep -E 'error:|failed' test.log | head -20 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi
          grep -h 'golden:' test.log || true
          grep -E 'Executed [0-9]+ tests' test.log | tail -1

      # A golden-image failure writes the render and an amplified
      # difference image; keep them so the failure can be seen.
      - name: Upload golden-image failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: .build/golden-failures
          if-no-files-found: ignore
